<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1160" viewBox="0 0 1180 1160" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <marker id="aL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="1180" height="1160" fill="#FFFFFF"/>

  <text x="40" y="44" font-size="19" font-weight="700" fill="#0F1B2A">Turn Lifecycle — one question through the supervisor graph</text>
  <text x="40" y="66" font-size="11.5" fill="#7A8A9A">One plan decides who runs and what each one is asked. Two specialists can work at once. Three loops, each with a ceiling — and one place where the graph stops and asks a person.</text>

  <!-- ══════════ ENTRY ══════════ -->
  <rect x="245" y="94" width="380" height="46" rx="7" fill="#FFFFFF" stroke="#1E2B3A" stroke-width="1.4"/>
  <text x="435" y="114" font-size="12.5" font-weight="600" fill="#1E2B3A" text-anchor="middle">User question</text>
  <text x="435" y="131" font-size="10" fill="#8B98A5" text-anchor="middle">Streamlit chat · sidebar example · evaluation harness</text>

  <path d="M 435 140 L 435 166" stroke="#64748B" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="145" y="172" width="580" height="70" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="166" y="194" font-size="12" font-weight="700" fill="#1E2B3A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">GraphAgent.stream_turn(question, thread_id)</text>
  <text x="166" y="214" font-size="10.5" fill="#5B6B7C">_turn_input() clears every per-turn channel — findings, both budgets, the route,</text>
  <text x="166" y="230" font-size="10.5" fill="#5B6B7C">any parked query. history is the one channel deliberately left to carry over.</text>

  <path d="M 435 242 L 435 268" stroke="#64748B" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- ══════════ SUPERVISOR ══════════ -->
  <rect x="105" y="274" width="660" height="104" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="126" y="298" font-size="14" font-weight="700" fill="#3730A3">supervisor · first pass</text>
  <text x="744" y="297" font-size="9.5" fill="#6366F1" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Supervisor.plan()</text>
  <text x="126" y="320" font-size="10.5" fill="#3F3F8A">One structured call returns tasks: [{agent, query}] and a mode. On a follow-up the</text>
  <text x="126" y="336" font-size="10.5" fill="#3F3F8A">same call also rewrites the question to stand on its own, from the last four turns.</text>
  <text x="126" y="356" font-size="10" fill="#6D6DA8">Nothing usable back from the model → rag alone, on the whole question. It says what it</text>
  <text x="126" y="370" font-size="10" fill="#6D6DA8">does not know; a guessed query does not.</text>

  <!-- split -->
  <path d="M 435 378 L 435 396" stroke="#64748B" stroke-width="1.6" fill="none"/>
  <path d="M 240 396 L 630 396" stroke="#64748B" stroke-width="1.6" fill="none"/>
  <path d="M 240 396 L 240 418" stroke="#64748B" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M 630 396 L 630 418" stroke="#64748B" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <!-- ══════════ RAG LANE ══════════ -->
  <rect x="40" y="424" width="390" height="356" rx="10" fill="#F4FAF9" stroke="#A7C7C2"/>
  <text x="58" y="446" font-size="10.5" font-weight="700" fill="#0B5C55" letter-spacing="1.2">DOCUMENTATION SPECIALIST — rag</text>

  <rect x="58" y="458" width="354" height="50" rx="7" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="76" y="478" font-size="11.5" font-weight="600" fill="#1E2B3A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">retrieve(its half of the question)</text>
  <text x="76" y="496" font-size="10" fill="#8B98A5">embed, then the 4 nearest chunks from Chroma</text>

  <path d="M 235 508 L 235 522" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="58" y="528" width="354" height="62" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-dasharray="4 3"/>
  <text x="76" y="548" font-size="11.5" font-weight="600" fill="#1E2B3A">grade what came back</text>
  <text x="396" y="547" font-size="9" font-weight="700" fill="#94A3B8" text-anchor="end">OFF BY DEFAULT</text>
  <text x="76" y="566" font-size="10" fill="#5B6B7C">insufficient → rewrite the search query and retry</text>
  <text x="76" y="581" font-size="10" fill="#8B98A5">≤ 2 retrievals. The rewrite is a search term, not a new question.</text>

  <path d="M 58 559 L 44 559 L 44 483 L 58 483" stroke="#94A3B8" stroke-width="1.3" fill="none" marker-end="url(#aL)" stroke-dasharray="4 3"/>

  <path d="M 235 590 L 235 604" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="58" y="610" width="354" height="62" rx="7" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="76" y="630" font-size="11.5" font-weight="600" fill="#1E2B3A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">generate(question, docs)</text>
  <text x="76" y="648" font-size="10" fill="#5B6B7C">answers from the context only, or says it cannot</text>
  <text x="76" y="663" font-size="10" fill="#8B98A5">cites every chunk: [Source: title | service]</text>

  <path d="M 235 672 L 235 686" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="58" y="692" width="354" height="66" rx="7" fill="#F0FAF8" stroke="#0F766E" stroke-width="1.3"/>
  <text x="76" y="712" font-size="11.5" font-weight="700" fill="#0B5C55">finding</text>
  <text x="76" y="730" font-size="10" fill="#5B6B7C">agent · the query it actually answered · answer</text>
  <text x="76" y="745" font-size="10" fill="#5B6B7C">citations[] · retrieved_texts[] (kept for the critic and RAGAS)</text>

  <!-- ══════════ SQL LANE ══════════ -->
  <rect x="450" y="424" width="390" height="356" rx="10" fill="#FDFAF5" stroke="#E4C49A"/>
  <text x="468" y="446" font-size="10.5" font-weight="700" fill="#92400E" letter-spacing="1.2">DATA SPECIALIST — sql</text>

  <rect x="468" y="458" width="330" height="50" rx="7" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="486" y="478" font-size="11" font-weight="600" fill="#1E2B3A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">generate_sql(its own half)</text>
  <text x="486" y="496" font-size="10" fill="#8B98A5">schema in the prompt · never the body column · LIMIT 50</text>

  <path d="M 633 508 L 633 520" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="468" y="526" width="330" height="56" rx="7" fill="#FFFFFF" stroke="#B45309" stroke-width="1.3"/>
  <text x="486" y="546" font-size="11" font-weight="600" fill="#92400E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">review(sql) → allow|confirm|reject</text>
  <text x="486" y="564" font-size="10" fill="#5B6B7C">literals and comments stripped first, then one statement judged</text>
  <text x="486" y="577" font-size="10" fill="#8B98A5">reject goes back to the repair loop, never to a person</text>

  <path d="M 633 582 L 633 594" stroke="#DC2626" stroke-width="1.5" marker-end="url(#aR)"/>

  <rect x="468" y="600" width="330" height="58" rx="7" fill="#FEF3F2" stroke="#DC2626" stroke-width="1.3"/>
  <text x="486" y="620" font-size="11.5" font-weight="700" fill="#991B1B">interrupt() — the turn stops</text>
  <text x="782" y="619" font-size="9" font-weight="700" fill="#DC2626" text-anchor="end">HUMAN</text>
  <text x="486" y="638" font-size="10" fill="#7F5252">only on a confirm verdict, or a query the repairer wrote</text>
  <text x="486" y="651" font-size="10" fill="#B08585">Run it → exactly what is shown executes, or answer without it</text>

  <path d="M 633 658 L 633 670" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="468" y="676" width="330" height="52" rx="7" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="486" y="696" font-size="11" font-weight="600" fill="#1E2B3A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">execute_sql → looks_empty?</text>
  <text x="486" y="714" font-size="10" fill="#5B6B7C">an error, or a COUNT of zero → repair (≤ 2 attempts)</text>

  <path d="M 798 702 L 814 702 L 814 484 L 798 484" stroke="#94A3B8" stroke-width="1.3" fill="none" marker-end="url(#aL)" stroke-dasharray="4 3"/>
  <text x="826" y="593" font-size="9.5" fill="#94A3B8" transform="rotate(-90 826 593)" text-anchor="middle">repair, shown the real values</text>

  <rect x="468" y="736" width="330" height="34" rx="7" fill="#FDF7EE" stroke="#B45309" stroke-width="1.3"/>
  <text x="486" y="757" font-size="11" font-weight="700" fill="#92400E">finding <tspan font-weight="400" fill="#5B6B7C" font-size="10">— answer · sql · DataFrame · error, if any</tspan></text>

  <path d="M 633 728 L 633 734" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ══════════ FAN-IN ══════════ -->
  <path d="M 235 758 L 235 800 L 435 800" stroke="#0F766E" stroke-width="1.5" fill="none" stroke-dasharray="5 3"/>
  <path d="M 633 770 L 633 800 L 435 800" stroke="#0F766E" stroke-width="1.5" fill="none" stroke-dasharray="5 3"/>
  <path d="M 435 800 L 435 818" stroke="#0F766E" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="5 3"/>

  <rect x="105" y="824" width="660" height="66" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.4"/>
  <text x="126" y="846" font-size="12.5" font-weight="700" fill="#3730A3">supervisor · woken once per specialist</text>
  <text x="126" y="864" font-size="10.5" fill="#3F3F8A">A wake-up arriving while another branch is still working is parked, not acted on —</text>
  <text x="126" y="879" font-size="10.5" fill="#3F3F8A">otherwise a retrying branch loses its findings and the answer is built from half the evidence.</text>

  <path d="M 435 890 L 435 908" stroke="#64748B" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- ══════════ TAIL ══════════ -->
  <rect x="40" y="914" width="238" height="72" rx="7" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="58" y="936" font-size="12" font-weight="700" fill="#1E2B3A">synthesize</text>
  <text x="58" y="954" font-size="10" fill="#5B6B7C">two findings → one answer, merged</text>
  <text x="58" y="968" font-size="10" fill="#5B6B7C">one finding → passed through untouched</text>
  <text x="58" y="981" font-size="9.5" fill="#8B98A5">route is derived from who actually ran</text>

  <rect x="298" y="914" width="238" height="72" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-dasharray="4 3"/>
  <text x="316" y="936" font-size="12" font-weight="700" fill="#1E2B3A">critic</text>
  <text x="518" y="935" font-size="9" font-weight="700" fill="#94A3B8" text-anchor="end">OFF BY DEFAULT</text>
  <text x="316" y="954" font-size="10" fill="#5B6B7C">every claim checked against the sources —</text>
  <text x="316" y="968" font-size="10" fill="#5B6B7C">documents <tspan font-weight="600">and</tspan> the query result, both</text>
  <text x="316" y="981" font-size="9.5" fill="#8B98A5">not grounded → one redraft, then it ships</text>

  <rect x="556" y="914" width="238" height="72" rx="7" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="574" y="936" font-size="12" font-weight="700" fill="#1E2B3A">remember → END</text>
  <text x="574" y="954" font-size="10" fill="#5B6B7C">files {question, answer} in history</text>
  <text x="574" y="968" font-size="10" fill="#5B6B7C">the transcript keeps what was typed,</text>
  <text x="574" y="981" font-size="9.5" fill="#8B98A5">not the supervisor's rewrite of it</text>

  <path d="M 278 950 L 292 950" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M 536 950 L 550 950" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M 400 914 L 400 900 L 159 900 L 159 908" stroke="#94A3B8" stroke-width="1.3" fill="none" marker-end="url(#aL)" stroke-dasharray="4 3"/>

  <path d="M 675 986 L 675 1006 L 435 1006 L 435 1020" stroke="#64748B" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <!-- ══════════ ENVELOPE ══════════ -->
  <rect x="105" y="1026" width="660" height="82" rx="8" fill="#F8FAFC" stroke="#1E2B3A" stroke-width="1.4"/>
  <text x="126" y="1048" font-size="12" font-weight="700" fill="#1E2B3A">project(question, state) — the same envelope v1 returned</text>
  <text x="126" y="1068" font-size="10.5" fill="#5B6B7C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">{ question, route, answer, citations[], data: DataFrame|None, sql: str|None }</text>
  <text x="126" y="1088" font-size="10" fill="#8B98A5">Streamlit renders the answer, the table, st.code(sql), the sources — and the steps narrate.describe()</text>
  <text x="126" y="1101" font-size="10" fill="#8B98A5">produced from the same stream, so a person can see who was dispatched and what was retried.</text>

  <!-- ══════════ SIDEBAR ══════════ -->
  <rect x="870" y="94" width="270" height="196" rx="8" fill="#F5F7F9" stroke="#E2E8EE"/>
  <text x="890" y="118" font-size="10.5" font-weight="700" fill="#8B98A5" letter-spacing="1.2">WHAT ONE PLAN CAN SAY</text>

  <rect x="888" y="130" width="234" height="46" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="902" y="148" font-size="10.5" font-weight="600" fill="#1E2B3A">one specialist</text>
  <text x="902" y="164" font-size="9.5" fill="#8B98A5">asked the question unchanged</text>

  <rect x="888" y="182" width="234" height="46" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="902" y="200" font-size="10.5" font-weight="600" fill="#1E2B3A">two, parallel</text>
  <text x="902" y="216" font-size="9.5" fill="#8B98A5">each asked only its own half</text>

  <rect x="888" y="234" width="234" height="46" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="902" y="252" font-size="10.5" font-weight="600" fill="#1E2B3A">two, sequential</text>
  <text x="902" y="268" font-size="9.5" fill="#8B98A5">sql first; rag's half rewritten from it</text>

  <rect x="870" y="306" width="270" height="180" rx="8" fill="#F5F7F9" stroke="#E2E8EE"/>
  <text x="890" y="330" font-size="10.5" font-weight="700" fill="#8B98A5" letter-spacing="1.2">CEILINGS</text>
  <text x="890" y="354" font-size="10.5" fill="#5B6B7C">supervisor dispatches</text>
  <text x="1120" y="354" font-size="10.5" font-weight="600" fill="#1E2B3A" text-anchor="end">4 / turn</text>
  <text x="890" y="376" font-size="10.5" fill="#5B6B7C">retrievals</text>
  <text x="1120" y="376" font-size="10.5" font-weight="600" fill="#1E2B3A" text-anchor="end">2 / dispatch</text>
  <text x="890" y="398" font-size="10.5" fill="#5B6B7C">SQL attempts</text>
  <text x="1120" y="398" font-size="10.5" font-weight="600" fill="#1E2B3A" text-anchor="end">2 / dispatch</text>
  <text x="890" y="420" font-size="10.5" fill="#5B6B7C">critic redrafts</text>
  <text x="1120" y="420" font-size="10.5" font-weight="600" fill="#1E2B3A" text-anchor="end">1 / turn</text>
  <text x="890" y="448" font-size="9.5" fill="#8B98A5">The per-specialist budgets are reset on</text>
  <text x="890" y="462" font-size="9.5" fill="#8B98A5">every dispatch, so a re-dispatch gets a</text>
  <text x="890" y="476" font-size="9.5" fill="#8B98A5">fresh allowance. A cycle without a</text>
  <text x="890" y="490" font-size="9.5" fill="#8B98A5">ceiling is a hang.</text>

  <rect x="870" y="502" width="270" height="182" rx="8" fill="#F5F7F9" stroke="#E2E8EE"/>
  <text x="890" y="526" font-size="10.5" font-weight="700" fill="#8B98A5" letter-spacing="1.2">WHAT A TURN COSTS</text>
  <text x="890" y="550" font-size="10.5" fill="#5B6B7C">one specialist</text>
  <text x="1120" y="550" font-size="10.5" font-weight="600" fill="#1E2B3A" text-anchor="end">2 chat calls</text>
  <text x="890" y="572" font-size="10.5" fill="#5B6B7C">two, parallel</text>
  <text x="1120" y="572" font-size="10.5" font-weight="600" fill="#1E2B3A" text-anchor="end">4 + merge</text>
  <text x="890" y="594" font-size="10.5" fill="#5B6B7C">two, sequential</text>
  <text x="1120" y="594" font-size="10.5" font-weight="600" fill="#1E2B3A" text-anchor="end">+ 1 refine</text>
  <text x="890" y="616" font-size="10.5" fill="#5B6B7C">each repair attempt</text>
  <text x="1120" y="616" font-size="10.5" font-weight="600" fill="#1E2B3A" text-anchor="end">+ 1</text>
  <text x="890" y="644" font-size="9.5" fill="#8B98A5">Measured over the 30-sample set:</text>
  <text x="890" y="658" font-size="9.5" fill="#8B98A5">3.63 chat calls and 2,338 tokens per</text>
  <text x="890" y="672" font-size="9.5" fill="#8B98A5">question, p50 latency 2.93 s.</text>

  <rect x="870" y="700" width="270" height="150" rx="8" fill="#F5F7F9" stroke="#E2E8EE"/>
  <text x="890" y="724" font-size="10.5" font-weight="700" fill="#8B98A5" letter-spacing="1.2">TIMEOUTS, PER CALL</text>
  <text x="890" y="748" font-size="10.5" fill="#5B6B7C">chat completions</text>
  <text x="1120" y="748" font-size="10.5" font-weight="600" fill="#1E2B3A" text-anchor="end">60 s</text>
  <text x="890" y="770" font-size="10.5" fill="#5B6B7C">embeddings</text>
  <text x="1120" y="770" font-size="10.5" font-weight="600" fill="#1E2B3A" text-anchor="end">30 s</text>
  <text x="890" y="792" font-size="10.5" fill="#5B6B7C">planning · grading · critique</text>
  <text x="1120" y="792" font-size="10.5" font-weight="600" fill="#1E2B3A" text-anchor="end">30 s</text>
  <text x="890" y="820" font-size="9.5" fill="#8B98A5">Never one global budget: a turn makes</text>
  <text x="890" y="834" font-size="9.5" fill="#8B98A5">several sequential calls, and a shared</text>
  <text x="890" y="848" font-size="9.5" fill="#8B98A5">clock would kill the last one.</text>

  <rect x="870" y="866" width="270" height="120" rx="8" fill="#FEF3F2" stroke="#F0BDBD"/>
  <text x="890" y="890" font-size="10.5" font-weight="700" fill="#991B1B" letter-spacing="1.2">WHERE IT STOPS FOR A PERSON</text>
  <text x="890" y="912" font-size="9.5" fill="#7F5252">A query the reviewer cannot classify, or</text>
  <text x="890" y="926" font-size="9.5" fill="#7F5252">one the repairer rewrote rather than the</text>
  <text x="890" y="940" font-size="9.5" fill="#7F5252">one the question produced. Ordinary</text>
  <text x="890" y="954" font-size="9.5" fill="#7F5252">reads are not gated — a confirmation on</text>
  <text x="890" y="968" font-size="9.5" fill="#7F5252">everything teaches people to click</text>
  <text x="890" y="982" font-size="9.5" fill="#7F5252">through it. Off outside the app.</text>

  <!-- ══════════ LEGEND ══════════ -->
  <path d="M 40 1132 L 1140 1132" stroke="#E2E8EE"/>
  <path d="M 60 1146 L 96 1146" stroke="#64748B" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="106" y="1150" font-size="10" fill="#7A8A9A">control flow</text>
  <path d="M 200 1146 L 236 1146" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="246" y="1150" font-size="10" fill="#7A8A9A">a finding reported back</text>
  <path d="M 400 1146 L 436 1146" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="446" y="1150" font-size="10" fill="#7A8A9A">a loop, with a ceiling</text>
  <rect x="596" y="1140" width="14" height="11" rx="2" fill="#FEF3F2" stroke="#DC2626"/>
  <text x="620" y="1150" font-size="10" fill="#7A8A9A">stops and asks</text>
  <rect x="740" y="1140" width="14" height="11" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-dasharray="3 2"/>
  <text x="764" y="1150" font-size="10" fill="#7A8A9A">in the tree, off in the shipped configuration</text>
</svg>
