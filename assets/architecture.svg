<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="900" viewBox="0 0 940 900" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="940" height="900" fill="#FFFFFF"/>

  <!-- ============ TITLE ============ -->
  <text x="40" y="44" font-size="19" font-weight="700" fill="#0F1B2A">AWS AI/ML Knowledge &amp; Analytics Agent — System Architecture</text>
  <text x="40" y="66" font-size="11.5" fill="#7A8A9A">Router-first agent — one chat entry point, two specialised pipelines, deterministic guardrails. Layers 2–4 run in a single Python process.</text>

  <!-- ============ BAND A · INTERFACE ============ -->
  <rect x="40" y="92" width="860" height="108" rx="10" fill="#F5F7F9" stroke="#E2E8EE"/>
  <text x="56" y="114" font-size="10.5" font-weight="700" fill="#8B98A5" letter-spacing="1.4">1 · INTERFACE</text>

  <rect x="60" y="128" width="400" height="60" rx="7" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="60" y="128" width="4" height="60" rx="2" fill="#64748B"/>
  <text x="80" y="152" font-size="13.5" font-weight="600" fill="#1E2B3A">Streamlit App</text>
  <text x="80" y="169" font-size="10.5" fill="#5B6B7C">app.py — Chat tab · Evaluation Dashboard tab</text>
  <text x="80" y="183" font-size="10.5" fill="#8B98A5">@st.cache_resource → one agent instance per process</text>

  <rect x="480" y="128" width="400" height="60" rx="7" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="480" y="128" width="4" height="60" rx="2" fill="#64748B"/>
  <text x="500" y="152" font-size="13.5" font-weight="600" fill="#1E2B3A">CLI / Batch</text>
  <text x="500" y="169" font-size="10.5" fill="#5B6B7C">scripts/test_agent.py · scripts/run_evaluation.py</text>
  <text x="500" y="183" font-size="10.5" fill="#8B98A5">same AWSAgent entry point, no UI dependency</text>

  <!-- ============ BAND B · ORCHESTRATION ============ -->
  <rect x="40" y="216" width="860" height="148" rx="10" fill="#F5F7F9" stroke="#E2E8EE"/>
  <text x="56" y="238" font-size="10.5" font-weight="700" fill="#8B98A5" letter-spacing="1.4">2 · ORCHESTRATION</text>
  <text x="884" y="238" font-size="10.5" fill="#8B98A5" text-anchor="end">AWSAgent.run(question) · src/agent/agent.py</text>

  <path d="M 470 188 L 470 248" stroke="#64748B" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="480" y="212" font-size="10" fill="#7A8A9A">question: str</text>

  <rect x="250" y="254" width="440" height="72" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="270" y="282" font-size="14" font-weight="700" fill="#3730A3">QueryRouter</text>
  <text x="670" y="281" font-size="9.5" fill="#6366F1" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">src/router/router.py</text>
  <text x="270" y="301" font-size="10.5" fill="#3F3F8A">gpt-4o-mini · temperature 0 · timeout 30 s · ~10 output tokens</text>
  <text x="270" y="317" font-size="10.5" fill="#6D6DA8">single-word classification · unrecognised output → rag (safe default)</text>

  <!-- ============ BAND C · PIPELINES ============ -->
  <rect x="40" y="380" width="860" height="284" rx="10" fill="#F5F7F9" stroke="#E2E8EE"/>
  <text x="56" y="402" font-size="10.5" font-weight="700" fill="#8B98A5" letter-spacing="1.4">3 · EXECUTION PIPELINES</text>

  <!-- branch split -->
  <path d="M 470 326 L 470 352" stroke="#64748B" stroke-width="1.6" fill="none"/>
  <path d="M 245 352 L 695 352" stroke="#64748B" stroke-width="1.6" fill="none"/>
  <path d="M 245 352 L 245 408" stroke="#64748B" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 695 352 L 695 408" stroke="#64748B" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="330" y="345" font-size="10" font-weight="600" fill="#0F766E" text-anchor="middle">route = rag | both</text>
  <text x="612" y="345" font-size="10" font-weight="600" fill="#B45309" text-anchor="middle">route = sql | both</text>


  <!-- RAG -->
  <rect x="60" y="414" width="370" height="234" rx="9" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
  <text x="76" y="440" font-size="14" font-weight="700" fill="#0B5C55">RAGPipeline</text>
  <text x="414" y="439" font-size="9.5" fill="#5A9E96" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">src/rag/pipeline.py</text>
  <text x="76" y="456" font-size="10" fill="#8B98A5">conceptual questions — grounded in AWS documentation</text>

  <rect x="76" y="470" width="338" height="52" rx="6" fill="#F0FAF8" stroke="#BFE0DA"/>
  <circle cx="98" cy="496" r="9.5" fill="#0F766E"/>
  <text x="98" y="500" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="118" y="492" font-size="11.5" font-weight="600" fill="#0B5C55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">retriever.invoke(query)</text>
  <text x="118" y="508" font-size="10" fill="#5B6B7C">Chroma cosine similarity · k = 4 chunks</text>

  <rect x="76" y="530" width="338" height="52" rx="6" fill="#F0FAF8" stroke="#BFE0DA"/>
  <circle cx="98" cy="556" r="9.5" fill="#0F766E"/>
  <text x="98" y="560" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="118" y="552" font-size="11.5" font-weight="600" fill="#0B5C55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">format_context(docs)</text>
  <text x="118" y="568" font-size="10" fill="#5B6B7C">[title | service] + text + URL, joined by rules</text>

  <rect x="76" y="590" width="338" height="52" rx="6" fill="#F0FAF8" stroke="#BFE0DA"/>
  <circle cx="98" cy="616" r="9.5" fill="#0F766E"/>
  <text x="98" y="620" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="118" y="612" font-size="11.5" font-weight="600" fill="#0B5C55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">llm.invoke(RAG_PROMPT)</text>
  <text x="118" y="628" font-size="10" fill="#5B6B7C">context-only answer + [Source: title | service]</text>

  <!-- SQL -->
  <rect x="510" y="414" width="370" height="234" rx="9" fill="#FFFFFF" stroke="#B45309" stroke-width="1.6"/>
  <text x="526" y="440" font-size="14" font-weight="700" fill="#92400E">SQLPipeline</text>
  <text x="864" y="439" font-size="9.5" fill="#C08A4A" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">src/sql/pipeline.py</text>
  <text x="526" y="456" font-size="10" fill="#8B98A5">quantitative questions — aggregation over structured data</text>

  <rect x="526" y="470" width="338" height="40" rx="6" fill="#FDF7EE" stroke="#EEDCC2"/>
  <circle cx="548" cy="490" r="9.5" fill="#B45309"/>
  <text x="548" y="494" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="568" y="487" font-size="11.5" font-weight="600" fill="#92400E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">generate_sql()</text>
  <text x="568" y="501" font-size="10" fill="#5B6B7C">schema in prompt · no body column · LIMIT 50</text>

  <rect x="526" y="514" width="338" height="40" rx="6" fill="#FDF7EE" stroke="#EEDCC2"/>
  <circle cx="548" cy="534" r="9.5" fill="#B45309"/>
  <text x="548" y="538" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="568" y="531" font-size="11.5" font-weight="600" fill="#92400E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">validate_sql()</text>
  <text x="568" y="545" font-size="10" fill="#5B6B7C">word-boundary regex guard · SELECT-only</text>

  <rect x="526" y="558" width="338" height="40" rx="6" fill="#FDF7EE" stroke="#EEDCC2"/>
  <circle cx="548" cy="578" r="9.5" fill="#B45309"/>
  <text x="548" y="582" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="568" y="575" font-size="11.5" font-weight="600" fill="#92400E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">execute_sql()</text>
  <text x="568" y="589" font-size="10" fill="#5B6B7C">pandas.read_sql → DataFrame</text>

  <rect x="526" y="602" width="338" height="40" rx="6" fill="#FDF7EE" stroke="#EEDCC2"/>
  <circle cx="548" cy="622" r="9.5" fill="#B45309"/>
  <text x="548" y="626" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="568" y="619" font-size="11.5" font-weight="600" fill="#92400E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">explain_results()</text>
  <text x="568" y="633" font-size="10" fill="#5B6B7C">drop body · head(20) · truncate 4 000 chars</text>

  <!-- OpenAI spine -->
  <path d="M 470 352 L 470 714" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arrowDash)"/>
  <path d="M 430 556 L 470 556" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4" fill="none"/>
  <path d="M 510 556 L 470 556" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4" fill="none"/>
  <circle cx="470" cy="556" r="3.4" fill="#94A3B8"/>
  <rect x="398" y="665" width="144" height="15" fill="#FFFFFF"/>
  <text x="470" y="677" font-size="9.5" fill="#94A3B8" text-anchor="middle">HTTPS · model calls</text>

  <!-- ============ BAND D · BACKING SERVICES ============ -->
  <rect x="40" y="684" width="860" height="156" rx="10" fill="#F5F7F9" stroke="#E2E8EE"/>
  <text x="56" y="706" font-size="10.5" font-weight="700" fill="#8B98A5" letter-spacing="1.4">4 · BACKING SERVICES</text>

  <path d="M 185 648 L 185 720" stroke="#64748B" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="194" y="670" font-size="9.5" fill="#7A8A9A">embed + search</text>
  <path d="M 755 648 L 755 720" stroke="#64748B" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="764" y="670" font-size="9.5" fill="#7A8A9A">read-only SELECT</text>

  <rect x="60" y="720" width="250" height="104" rx="8" fill="#F6F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="80" y="748" font-size="13.5" font-weight="700" fill="#5B21B6">ChromaDB</text>
  <text x="80" y="768" font-size="10" fill="#6D28D9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">data/processed/chroma</text>
  <text x="80" y="786" font-size="10.5" fill="#5B6B7C">collection: aws_docs · persistent</text>
  <text x="80" y="803" font-size="10.5" fill="#5B6B7C">156 chunks from 18 AWS doc pages</text>

  <rect x="345" y="720" width="250" height="104" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="365" y="748" font-size="13.5" font-weight="700" fill="#475569">OpenAI API</text>
  <rect x="500" y="735" width="75" height="17" rx="8.5" fill="#EEF2F6"/>
  <text x="537.5" y="747" font-size="8.5" font-weight="700" fill="#7A8A9A" text-anchor="middle" letter-spacing="0.8">EXTERNAL</text>
  <text x="365" y="768" font-size="10.5" fill="#5B6B7C">gpt-4o-mini · temp 0 · timeout 60 s</text>
  <text x="365" y="786" font-size="10.5" fill="#5B6B7C">text-embedding-3-small · timeout 30 s</text>
  <text x="365" y="803" font-size="10.5" fill="#8B98A5">4 sequential calls on the both route</text>

  <rect x="630" y="720" width="250" height="104" rx="8" fill="#F6F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="650" y="748" font-size="13.5" font-weight="700" fill="#5B21B6">SQLite</text>
  <text x="650" y="768" font-size="10" fill="#6D28D9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">data/processed/issues.db</text>
  <text x="650" y="786" font-size="10.5" fill="#5B6B7C">issues — 283 rows</text>
  <text x="650" y="803" font-size="10.5" fill="#5B6B7C">stackoverflow — 15 462 rows</text>

  <!-- ============ LEGEND ============ -->
  <path d="M 40 858 L 900 858" stroke="#E2E8EE" stroke-width="1"/>
  <path d="M 60 878 L 92 878" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="100" y="882" font-size="10" fill="#7A8A9A">in-process call</text>

  <path d="M 210 878 L 242 878" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <text x="250" y="882" font-size="10" fill="#7A8A9A">network call to an external service</text>

  <rect x="470" y="871" width="14" height="14" rx="3" fill="#F6F3FF" stroke="#7C3AED"/>
  <text x="492" y="882" font-size="10" fill="#7A8A9A">local persistent store</text>

  <rect x="626" y="871" width="14" height="14" rx="3" fill="#EEF2FF" stroke="#4F46E5"/>
  <text x="648" y="882" font-size="10" fill="#7A8A9A">LLM decision point</text>

</svg>
